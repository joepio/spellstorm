name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release with this tag (for example v0.1.0); empty for a plain build
        required: false
        default: ''
permissions:
  contents: read
env:
  GODOT_VERSION: 4.5
jobs:
  gamenight-sdk:
    uses: ontola/gamenight/.github/workflows/godot-sdk-check.yml@main
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Godot and the Windows export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot" && rm godot.zip
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir"
          unzip -q -j templates.tpz templates/version.txt templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe -d "$dir"
          rm templates.tpz
          pip install websockets
      - name: Import
        run: $RUNNER_TEMP/godot --headless --import || true
      - name: Spell grammar (every reachable queue)
        run: $RUNNER_TEMP/godot --headless --script tests/spell_test.gd
      - name: Damage budget (docs/balance.md)
        run: $RUNNER_TEMP/godot --headless --script tests/balance_test.gd
      - name: A live run with bots (shoot, swing, roll, bullets, spells)
        run: $RUNNER_TEMP/godot --headless --fixed-fps 60 --path . -- --sim 3600 --seed 1
      - name: GameNight lifecycle and controller input
        run: python tests/lifecycle.py --godot $RUNNER_TEMP/godot
      - name: Export Windows build
        run: |
          mkdir -p build/windows
          $RUNNER_TEMP/godot --headless --export-release "Windows" build/windows/Spellstorm.exe
          $RUNNER_TEMP/godot --headless --export-pack "Windows" build/spellstorm.pck
      - name: The exported game runs
        run: python tests/lifecycle.py --godot $RUNNER_TEMP/godot --pack build/spellstorm.pck
      - name: Package
        run: |
          cd build/windows
          zip -q -9 spellstorm-windows.zip Spellstorm*.exe
          sha256sum spellstorm-windows.zip > release-sha256.txt
          cat release-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: spellstorm-windows
          path: |
            build/windows/spellstorm-windows.zip
            build/windows/release-sha256.txt
          if-no-files-found: error
  release:
    needs: build
    # A pushed v* tag, or a manual run that names the tag to create.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # A GameNight publish key; without it the GameNight steps are skipped.
      GAMENIGHT_API_TOKEN: ${{ secrets.GAMENIGHT_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spellstorm-windows
          path: release
      - name: Publish the tested build and the store media
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release || github.ref_name }}
        run: |
          cd release
          sha256sum --check release-sha256.txt
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" spellstorm-windows.zip release-sha256.txt ../assets/gamenight/preview.mp4 ../assets/gamenight/preview.jpg ../assets/gamenight/cover.png ../assets/gamenight/icon.png ../assets/gamenight/gameplay.png --repo "$GITHUB_REPOSITORY" --title "Spellstorm $RELEASE_TAG" --notes-file ../docs/release-notes.md
      # Fills the GameNight store page from gamenight.json and assets/gamenight.
      - uses: actions/checkout@v4
        if: env.GAMENIGHT_API_TOKEN != ''
        with:
          repository: ontola/gamenight
          ref: 581dfed420c088f25781ea545d8e921e5934380e
          path: .gamenight
          sparse-checkout: scripts/gamenight-publish.py
          sparse-checkout-cone-mode: false
      # Store page first: a stable release needs the five-second clip.
      - name: Update the GameNight store page and publish the build to players
        if: env.GAMENIGHT_API_TOKEN != ''
        env:
          RELEASE_TAG: ${{ inputs.release || github.ref_name }}
        run: |
          python3 .gamenight/scripts/gamenight-publish.py store
          python3 .gamenight/scripts/gamenight-publish.py push --game spellstorm --file release/spellstorm-windows.zip --platform windows --entrypoint Spellstorm.exe --version "$RELEASE_TAG" --channel stable --changelog-file docs/release-notes.md
